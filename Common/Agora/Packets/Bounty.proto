syntax = "proto3";
package Agora;

import "Packets/Thing.proto";

// One bounty: "bring me these items and I'll pay you these".
// The reward is taken from the poster when they post it and held by the server until someone fulfils it,
// the poster cancels it, or it expires.
message Bounty
{
  string BountyId = 1;                    // Random unique ID the server picks
  string PosterUuid = 2;                  // UUID of the player who posted it

  // What the poster wants. For each item, Quality is the *lowest* quality they'll accept.
  // Awful (0) is the default, which means "any quality". Items that never have a quality, like steel, ignore it
  repeated Trading.ProtoThing WantedItems = 3;

  // TODO (yours): add the rest of the fields. You'll want:
  //   - the reward items (another repeated Trading.ProtoThing)
  //   - a note, like a listing has
  //   - when it was posted (int64, Unix seconds)
  //   - when it expires (int64, Unix seconds)
  // Look at Listing.proto for how each of these is written, and remember each field needs the next number.
};
